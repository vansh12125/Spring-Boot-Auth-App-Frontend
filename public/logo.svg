<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Deep Dark Contrast Background Panel (Optional - remove if you want it transparent) -->
  <rect width="120" height="120" rx="24" fill="#050507"/>

  <!-- Outer Tech Orbit Track (Dotted) -->
  <circle cx="60" cy="60" r="45" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.25"/>
  
  <!-- Outer Solid Accent Glow Rings -->
  <circle cx="60" cy="60" r="52" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- Left Code Bracket Curve -->
  <path d="M45 40C35 50 35 70 45 80" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Right Code Bracket Curve -->
  <path d="M75 40C85 50 85 70 75 80" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Center Network Core Cluster Node -->
  <circle cx="60" cy="60" r="10" fill="#ffffff"/>
  
  <!-- Core Radial Glow Effect (Simulated Vector Radiance) -->
  <circle cx="60" cy="60" r="18" fill="#ffffff" opacity="0.15"/>
</svg>
